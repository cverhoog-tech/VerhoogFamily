    <path d="M22.4 8.5c.1-1.3.7-2.2 1.7-2.8" fill="none" stroke="#5a7c36" stroke-width="1" stroke-linecap="round"/>
    <path d="M23.6 7.4c1.3-.3 2.3 0 3 .8-1 .9-2.2 1-3.4.5Z" fill="#6dad4d" stroke="#3f6d34" stroke-width=".75"/>
