<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>FamilieApp</title>
<style>
:root{--green:#3f7f2f;--dark:#111827;--muted:#6b7280;--card:#fff;--shadow:0 18px 45px rgba(17,24,39,.10);--radius:24px}*{box-sizing:border-box}body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--dark);max-width:480px;margin-inline:auto;min-height:100vh}.app{min-height:100vh;padding-bottom:82px}.header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #eef0ef}.avatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}.title{font-size:18px;font-weight:900;flex:1}.iconbtn{border:0;background:transparent;font-size:23px}.hero{padding:22px 20px 8px;display:flex;align-items:end;justify-content:space-between}.date{font-weight:800;color:var(--muted);font-size:16px;margin:0 0 4px}.greeting{font-size:30px;line-height:1.05;margin:0;font-weight:950;letter-spacing:-.06em}.bigavatar{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:950;box-shadow:0 12px 24px rgba(63,127,47,.24)}.xp{display:flex;align-items:center;gap:12px;padding:0 20px 16px}.bar{height:7px;background:#e5e7eb;border-radius:999px;flex:1;overflow:hidden}.fill{height:100%;width:48%;background:var(--green);border-radius:999px}.level,.pts{font-size:13px;font-weight:900}.pts{color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:0 20px 16px}.card{height:168px;border:0;border-radius:22px;position:relative;overflow:hidden;color:#fff;text-align:left;padding:14px;box-shadow:var(--shadow);background-size:cover;background-position:center;isolation:isolate}.card:before,.slide:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.28) 48%,rgba(0,0,0,.72))}.card:after{content:"";position:absolute;inset:0;z-index:-2;background:inherit;background-size:cover;background-position:center;filter:saturate(1.08) contrast(1.04)}.tasks{background-image:url('https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=900&q=90')}.shop{background-image:url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=900&q=90')}.posts{background-image:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=900&q=90')}.badge{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:20px;box-shadow:0 10px 22px rgba(0,0,0,.18);margin-bottom:30px}.num{display:block;font-size:44px;font-weight:950;line-height:.9;text-align:center;text-shadow:0 3px 12px rgba(0,0,0,.55)}.label{display:block;text-align:center;font-size:16px;font-weight:950;text-shadow:0 3px 12px rgba(0,0,0,.55);line-height:1.05}.arrow{position:absolute;bottom:14px;left:50%;translate:-50% 0;width:43px;height:43px;border-radius:50%;background:rgba(255,255,255,.96);display:grid;place-items:center;color:var(--green);font-weight:950;font-size:22px;box-shadow:0 10px 22px rgba(0,0,0,.2)}.carousel{margin:8px 20px 22px;height:236px;border-radius:28px;overflow:hidden;position:relative;box-shadow:var(--shadow)}.track{display:flex;height:100%;transition:transform .35s ease}.slide{min-width:100%;position:relative;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px}.recipes{background-image:url('https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=1200&q=90')}.agenda{background-image:url('https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=1200&q=90')}.meals{background-image:url('https://images.unsplash.com/photo-1543353071-10c8ba85a904?auto=format&fit=crop&w=1200&q=90')}.slide h2{font-size:34px;margin:10px 0 6px;font-weight:950;text-shadow:0 4px 16px rgba(0,0,0,.65)}.slide p{margin:0;font-weight:800;text-shadow:0 3px 12px rgba(0,0,0,.7)}.slide .cta{margin-top:18px;border:0;border-radius:999px;background:#fff;color:var(--green);font-weight:950;padding:13px 22px;font-size:15px}.nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none;padding:0 12px}.nav button{pointer-events:auto;width:43px;height:43px;border-radius:50%;border:0;background:rgba(255,255,255,.96);font-size:31px;color:#111827;font-weight:900;box-shadow:0 10px 22px rgba(0,0,0,.16)}.dots{position:absolute;bottom:13px;left:0;right:0;display:flex;justify-content:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55)}.dot.active{background:var(--green)}.section{padding:0 20px}.section-title{font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.15em;color:#697386;margin-bottom:12px}.activity{display:flex;align-items:center;gap:12px;padding:12px 0}.homeicon{width:42px;height:42px;border-radius:50%;background:#eaf6e7;display:grid;place-items:center}.small{font-size:13px;color:#6b7280}.bottom{position:fixed;bottom:0;left:50%;translate:-50% 0;width:100%;max-width:480px;height:70px;background:#fff;border-top:1px solid #eef0ef;display:flex;justify-content:space-around;align-items:center}.bottom button{border:0;background:transparent;color:#9ca3af;font-weight:800;font-size:11px}.bottom .active{color:var(--green)}.plus{width:50px!important;height:50px;border-radius:50%!important;background:var(--green)!important;color:#fff!important;font-size:28px!important;box-shadow:0 10px 24px rgba(63,127,47,.32)}@media(max-width:390px){.cards{gap:8px;padding-inline:16px}.card{height:154px}.greeting{font-size:27px}.carousel{margin-inline:16px}.num{font-size:38px}.label{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="avatar">SK</div><div class="title">FamilieApp 🌿</div><button class="iconbtn">⌕</button><button class="iconbtn">🔔</button></header>
<section class="hero"><div><p class="date">Dinsdag · 12 mei</p><h1 class="greeting">Goedemorgen, Shane</h1></div><div class="bigavatar">SK</div></section>
<div class="xp"><div class="bar"><div class="fill"></div></div><span class="level">Level 2 · Uitgebreid</span><span class="pts">143 XP</span></div>
<section class="cards"><button class="card tasks"><span class="badge">📝</span><span class="num">5</span><span class="label">taken</span><span class="arrow">→</span></button><button class="card shop"><span class="badge">🛒</span><span class="num">4</span><span class="label">boodschappen</span><span class="arrow" style="color:#d97706">→</span></button><button class="card posts"><span class="badge">💬</span><span class="num">2</span><span class="label">posts</span><span class="arrow" style="color:#c0547a">→</span></button></section>
<section class="carousel"><div class="track" id="track"><div class="slide recipes"><div><div class="badge" style="margin:auto">🌿</div><h2>Recepten</h2><p>Ontdek heerlijke recepten voor elke gelegenheid</p><button class="cta">Bekijk recepten →</button></div></div><div class="slide agenda"><div><div class="badge" style="margin:auto">🗓️</div><h2>Agenda</h2><p>Houd je afspraken bij en blijf georganiseerd</p><button class="cta">Bekijk agenda →</button></div></div><div class="slide meals"><div><div class="badge" style="margin:auto">🍽️</div><h2>Maaltijden</h2><p>Plan lekkere maaltijden met het gezin</p><button class="cta">Bekijk maaltijden →</button></div></div></div><div class="nav"><button onclick="move(-1)">‹</button><button onclick="move(1)">›</button></div><div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div></section>
<section class="section"><div class="section-title">Activiteit</div><div class="activity"><div class="homeicon">🏠</div><div><b>FamilieApp gestart!</b><div class="small">Nu</div></div></div></section>
</div>
<nav class="bottom"><button class="active">🏠<br>Home</button><button>✅<br>Taken</button><button class="plus">+</button><button>📝<br>Notities</button><button>···<br>Meer</button></nav>
<script>let i=0;function move(d){i=(i+d+3)%3;document.getElementById('track').style.transform='translateX('+(-i*100)+'%)';document.querySelectorAll('.dot').forEach((e,n)=>e.classList.toggle('active',n===i));}setInterval(()=>move(1),6000);</script>
</body>
</html>
