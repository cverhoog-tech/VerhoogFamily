<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FamilieApp">
<title>FamilieApp</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050819;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050819}#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 75% 0%,rgba(126,73,255,.32),transparent 38%),linear-gradient(180deg,#121a3f,#050819);color:#fff;z-index:2;font-weight:900;letter-spacing:.2px}
</style>
</head>
<body>
<div id="boot">FamilieApp wordt geladen...</div>
<iframe id="app-frame" src="./familyapp-asset-pack-update.html"></iframe>
<script>
(function(){
  var frame=document.getElementById('app-frame');
  var boot=document.getElementById('boot');
  var injected=false;
  frame.addEventListener('load',function(){
    if(injected) return;
    injected=true;
    setTimeout(function(){boot.style.display='none';},350);
    patchExactQuestHome();
  });

  function patchExactQuestHome(){
    var w=frame.contentWindow;
    var d=frame.contentDocument;
    if(!w||!d) return;

    var css=d.createElement('style');
    css.id='exact-quest-home-css';
    css.textContent=`
      body[data-current-screen="home"]{background:#050819!important;max-width:480px!important;margin:0 auto!important;color:#fff!important}
      body[data-current-screen="home"] .app-header{display:none!important}
      #screen-home.quest-home-v2{position:relative!important;background:radial-gradient(circle at 80% -5%,rgba(137,83,255,.38),transparent 35%),radial-gradient(circle at 10% 12%,rgba(39,196,255,.15),transparent 32%),linear-gradient(180deg,#111a43 0%,#09112d 48%,#050819 100%)!important;color:#fff!important;overflow-y:auto!important;min-height:100vh!important;padding:0 0 108px!important}
      #screen-home.quest-home-v2 #home-bg{display:none!important}
      .ex-wrap{padding:22px 18px 0}.ex-status{height:24px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:900;font-size:13px;opacity:.95;margin-bottom:16px}.ex-status-icons{font-size:12px;letter-spacing:1px;opacity:.9}.ex-hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-bottom:22px}.ex-title{font-size:33px;line-height:1.05;font-weight:950;letter-spacing:-1.2px;margin:0 0 11px;color:#fff;text-shadow:0 8px 22px rgba(255,255,255,.12)}.ex-sub{font-size:18px;line-height:1.42;font-weight:800;color:rgba(255,255,255,.72);max-width:230px}.ex-right{display:flex;flex-direction:column;align-items:flex-end;gap:16px}.ex-bell{width:43px;height:43px;border:none;border-radius:50%;background:rgba(255,255,255,.04);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.ex-avatars{display:flex;padding-right:3px}.ex-avatar,.ex-mini{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:950;background:linear-gradient(135deg,#27365f,#a855f7);border:3px solid #111a43;box-shadow:0 10px 22px rgba(0,0,0,.28);overflow:hidden}.ex-avatar{width:43px;height:43px;margin-left:-12px;font-size:12px}.ex-avatar:first-child{margin-left:0}.ex-avatar.partner{background:linear-gradient(135deg,#c0547a,#f472b6)}.ex-avatar.child{background:linear-gradient(135deg,#0ea5e9,#6366f1);font-size:10px}.ex-level{border:0;border-radius:999px;padding:9px 12px 9px 17px;display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#5c3af2,#a045ff);box-shadow:0 14px 30px rgba(111,68,255,.35),inset 0 1px 0 rgba(255,255,255,.22);color:#fff;font-size:15px;font-weight:950}.ex-star-badge{width:31px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}.ex-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:25px}.ex-stat{border:1px solid rgba(255,255,255,.06);background:linear-gradient(145deg,rgba(35,45,88,.82),rgba(18,23,55,.74));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.26);border-radius:27px;padding:17px 14px 16px;text-align:left;color:#fff;min-height:154px}.ex-stat-icon{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:17px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.13),0 10px 25px rgba(0,0,0,.24)}.ex-green{background:linear-gradient(135deg,#22d681,#068b56)}.ex-gold{background:linear-gradient(135deg,#ffc928,#f59e0b)}.ex-stat-label{display:block;font-size:14px;font-weight:900;color:rgba(255,255,255,.66);margin-bottom:7px}.ex-stat-value{display:block;font-size:28px;font-weight:950;letter-spacing:-.5px;line-height:1}.ex-stat-sub{display:block;font-size:13px;font-weight:900;margin-top:8px}.ex-stat-sub.green{color:#2fe18a}.ex-stat-sub.gold{color:#ffc43d}.ex-section{margin-top:26px}.ex-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.ex-section-title{font-size:14px;line-height:1;font-weight:950;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.86)}.ex-view{border:0;background:none;color:rgba(255,255,255,.48);font-size:14px;font-weight:850}.ex-list{display:flex;flex-direction:column;gap:13px}.ex-card{width:100%;border:1px solid rgba(255,255,255,.06);border-radius:26px;padding:15px;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;background:linear-gradient(145deg,rgba(37,48,93,.92),rgba(18,24,58,.88));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 13px 30px rgba(0,0,0,.24);color:#fff;text-align:left}.ex-task-icon{width:56px;height:56px;border-radius:19px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.16),0 10px 22px rgba(0,0,0,.25);overflow:hidden}.ex-blue{background:linear-gradient(135deg,#4de1ff,#0ea5e9)}.ex-pink{background:linear-gradient(135deg,#ff74d7,#c026d3)}.ex-orange{background:linear-gradient(135deg,#ffd64d,#f59e0b)}.ex-task-title{display:block;font-size:15px;font-weight:950;line-height:1.22;margin-bottom:12px}.ex-progress,.ex-group-progress{display:block;height:11px;border-radius:999px;background:rgba(5,9,27,.68);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}.ex-progress-fill{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#7df3a7,#a855f7)}.ex-xp{display:block;color:#ffd85a;font-size:13px;font-weight:950;text-align:right;margin-bottom:8px}.ex-count{display:block;color:rgba(255,255,255,.64);font-size:12px;font-weight:950;text-align:right}.ex-group{width:100%;border:1px solid rgba(168,85,247,.25);border-radius:28px;padding:19px;display:grid;grid-template-columns:1fr auto;gap:12px;color:#fff;text-align:left;background:linear-gradient(135deg,#622cff,#853dff);box-shadow:0 18px 40px rgba(78,35,187,.32),inset 0 1px 0 rgba(255,255,255,.18)}.ex-group-top{display:flex;gap:14px;align-items:center}.ex-group-icon{width:58px;height:58px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}.ex-group-title{display:block;font-size:20px;font-weight:950}.ex-group-sub{display:block;font-size:14px;font-weight:800;color:rgba(255,255,255,.7);margin-top:4px}.ex-group-avatars{display:flex;align-self:start;margin-top:2px}.ex-mini{width:34px;height:34px;margin-left:-9px;font-size:10px;border-width:2px;border-color:#7935ff}.ex-group-row{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:6px}.ex-group-fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#fff16b,#fb923c)}.ex-group-xp{font-size:15px;font-weight:950;color:#ffe376}.ex-feed{width:100%;border:1px solid rgba(255,255,255,.06);border-radius:26px;padding:15px;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;text-align:left;color:#fff;background:linear-gradient(145deg,rgba(35,47,91,.88),rgba(15,23,55,.91));box-shadow:0 13px 28px rgba(0,0,0,.22)}.ex-feed-avatars{display:flex}.ex-feed-text{display:block;font-size:14px;line-height:1.35;font-weight:850;color:rgba(255,255,255,.88)}.ex-feed-time{display:block;color:rgba(255,255,255,.45);font-size:12px;font-weight:800;margin-top:5px}.ex-feed-xp{font-size:14px;font-weight:950;color:#ffd45e}.ex-empty{padding:18px;border-radius:21px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);font-weight:850}.ex-ico{width:31px;height:31px;display:block}.ex-ico.big{width:35px;height:35px}.ex-ico.small{width:17px;height:17px}.ex-ico *{vector-effect:non-scaling-stroke}.bottom-nav{background:rgba(6,10,28,.86)!important;border-top:1px solid rgba(255,255,255,.07)!important;box-shadow:0 -18px 38px rgba(0,0,0,.42)!important;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}body[data-current-screen="home"] .bottom-nav{height:78px!important;border-radius:28px 28px 0 0!important}.nav-btn{color:rgba(255,255,255,.42)!important}.nav-btn.active{color:#a855f7!important;text-shadow:0 0 16px rgba(168,85,247,.76)}.nav-center-inner{background:linear-gradient(135deg,#c25fff,#6a36ff)!important;border-radius:22px!important;box-shadow:0 0 32px rgba(168,85,247,.78)!important;border-color:rgba(255,255,255,.08)!important}.nav-label{font-size:11px!important;font-weight:900!important}.nav-icon{font-size:23px!important}@media(max-width:380px){.ex-wrap{padding-left:14px;padding-right:14px}.ex-title{font-size:30px}.ex-sub{font-size:16px}.ex-stat-value{font-size:24px}.ex-card{grid-template-columns:54px 1fr auto}.ex-task-icon{width:50px;height:50px}.ex-group{grid-template-columns:1fr}.ex-group-avatars{margin-left:72px}}
    `;
    d.head.appendChild(css);

    w.exEscape=function(str){return String(str||'').replace(/[&<>'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c];});};
    w.exInitials=function(name){return (name||'F').split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0];}).join('').toUpperCase();};
    w.exFormat=function(n){n=Math.round(n||0);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
    w.exIcon=function(type){var c='class="ex-ico" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"';if(type==='spark')return '<svg '+c+'><path d="M32 7l6.8 17.2L56 31l-17.2 6.8L32 57l-6.8-19.2L8 31l17.2-6.8L32 7z" fill="white"/><path d="M48 9l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4L48 9z" fill="rgba(255,255,255,.72)"/></svg>';if(type==='moon')return '<svg '+c+'><path d="M44 49c-15 0-27-12-27-27 0-5 1.4-9.8 3.9-13.8C12.4 12.5 7 20.8 7 30.2 7 45 19 57 33.8 57c9.5 0 17.8-5.4 22-13.9A26.8 26.8 0 0144 49z" fill="white"/><path d="M48 10l2.3 5.7L56 18l-5.7 2.3L48 26l-2.3-5.7L40 18l5.7-2.3L48 10z" fill="rgba(255,255,255,.72)"/></svg>';if(type==='home')return '<svg '+c+'><path d="M10 32L32 12l22 20" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 30v23h30V30" fill="white"/><path d="M27 53V39h10v14" fill="rgba(14,165,233,.9)"/></svg>';if(type==='wash')return '<svg '+c+'><rect x="12" y="10" width="40" height="46" rx="6" fill="white"/><rect x="18" y="16" width="28" height="7" rx="2" fill="rgba(192,38,211,.95)"/><circle cx="32" cy="39" r="12" fill="rgba(192,38,211,.92)"/><path d="M25 39c4-5 10 5 14 0" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>';if(type==='cart')return '<svg '+c+'><path d="M11 15h7l5 27h24l6-18H24" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="51" r="5" fill="white"/><circle cx="45" cy="51" r="5" fill="white"/></svg>';if(type==='tent')return '<svg '+c+'><path d="M32 9L8 55h48L32 9z" fill="white"/><path d="M32 9v46M32 55L21 35M32 55l11-20" stroke="rgba(109,40,217,.9)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';if(type==='bell')return '<svg class="ex-ico big" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 48h28M22 48V28c0-7 4-13 10-13s10 6 10 13v20M28 53c1.2 3 6.8 3 8 0" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';return '<svg '+c+'><circle cx="32" cy="32" r="18" fill="white"/></svg>';};
    w.exTaskIcon=function(t,i){var text=(t&&t.title||'').toLowerCase();if(text.indexOf('was')>-1)return{icon:w.exIcon('wash'),cls:'ex-pink'};if(text.indexOf('boodschap')>-1||text.indexOf('winkel')>-1)return{icon:w.exIcon('cart'),cls:'ex-orange'};if(text.indexOf('woon')>-1||text.indexOf('schoon')>-1||text.indexOf('stof')>-1)return{icon:w.exIcon('home'),cls:'ex-blue'};var opts=[{icon:w.exIcon('home'),cls:'ex-blue'},{icon:w.exIcon('wash'),cls:'ex-pink'},{icon:w.exIcon('cart'),cls:'ex-orange'}];return opts[i%opts.length];};
    w.exXp=function(t,i){if(t&&t.prio==='high')return 15;if(t&&t.prio==='med')return 10+i*2;return 8;};

    w.installExactHome=function(){var home=d.getElementById('screen-home');if(!home)return;home.className='screen active quest-home-v2';if(!d.getElementById('ex-quests')){home.innerHTML='<div id="home-bg" aria-hidden="true"></div><div class="ex-wrap"><div class="ex-status"><span id="ex-time">9:41</span><span class="ex-status-icons">▮▮▮ ᯤ 🔋</span></div><section class="ex-hero"><div><h1 class="ex-title">👋 Hey Familie!</h1><div class="ex-sub">Samen maken we er een geweldige dag van.</div></div><div class="ex-right"><button class="ex-bell" onclick="showScreen(\'notif\')">'+w.exIcon('bell')+'</button><div class="ex-avatars"><span class="ex-avatar" id="ex-me">SH</span><span class="ex-avatar partner" id="ex-partner">ES</span><span class="ex-avatar child">FAM</span></div><button class="ex-level" onclick="showScreen(\'achievements\')"><span id="home-xp-level">Level 1</span><span class="ex-star-badge">'+w.exIcon('spark')+'</span></button></div></section><section class="ex-stats"><button class="ex-stat" onclick="showScreen(\'achievements\')"><span class="ex-stat-icon ex-green">'+w.exIcon('spark')+'</span><span class="ex-stat-label">Family XP</span><span class="ex-stat-value" id="ex-family-xp">0</span><span class="ex-stat-sub green" id="ex-today">+0 today</span></button><button class="ex-stat" onclick="showDailyBonus&&showDailyBonus()"><span class="ex-stat-icon ex-gold">'+w.exIcon('moon')+'</span><span class="ex-stat-label">Rested XP</span><span class="ex-stat-value">2.000</span><span class="ex-stat-sub gold">Ready to claim</span></button></section><section class="ex-section"><div class="ex-section-head"><div class="ex-section-title">Today\'s quests</div><button class="ex-view" onclick="showScreen(\'tasks\')">View all</button></div><div class="ex-list" id="ex-quests"></div></section><section class="ex-section"><div class="ex-section-head"><div class="ex-section-title">Group quest</div><button class="ex-view" onclick="showScreen(\'tasks\')">View all</button></div><div id="ex-group"></div></section><section class="ex-section"><div class="ex-section-head"><div class="ex-section-title">Activity feed</div><button class="ex-view" onclick="showScreen(\'feed\')">View all</button></div><div id="activity-list"></div></section></div>';}};
    w.renderExactQuests=function(){var el=d.getElementById('ex-quests');if(!el)return;var data=w.taskData||[];var qs=data.filter(function(t){return !t.done;}).slice(0,3);if(!qs.length){el.innerHTML='<div class="ex-empty">Geen open quests. Tijd om iets nieuws te plannen ✨</div>';return;}el.innerHTML=qs.map(function(t,i){var ico=w.exTaskIcon(t,i),xp=w.exXp(t,i);return '<button class="ex-card" onclick="showScreen(\'tasks\')"><span class="ex-task-icon '+ico.cls+'">'+ico.icon+'</span><span><span class="ex-task-title">'+w.exEscape(t.title)+'</span><span class="ex-progress"><span class="ex-progress-fill" style="width:'+(t.done?100:0)+'%"></span></span></span><span><span class="ex-xp">'+xp+' XP</span><span class="ex-count">'+(t.done?'1':'0')+'/1</span></span></button>';}).join('');};
    w.renderExactGroup=function(){var el=d.getElementById('ex-group');if(!el)return;var data=w.taskData||[],open=data.filter(function(t){return !t.done;}).length,total=Math.max(data.length,1),done=Math.max(0,total-open),pct=Math.min(100,Math.round(done/total*100));el.innerHTML='<button class="ex-group" onclick="showScreen(\'tasks\')"><span class="ex-group-top"><span class="ex-group-icon">'+w.exIcon('tent')+'</span><span><span class="ex-group-title">Weekend BBQ</span><span class="ex-group-sub">Nog '+Math.min(open,3)+' taken te gaan</span></span></span><span class="ex-group-avatars"><span class="ex-mini">'+w.exInitials(w.myName)+'</span><span class="ex-mini">'+w.exInitials(w.partnerName)+'</span><span class="ex-mini">F</span></span><span class="ex-group-row"><span class="ex-group-progress"><span class="ex-group-fill" style="width:'+Math.max(34,pct)+'%"></span></span><span class="ex-group-xp">+75 XP</span></span></button>';};
    w.renderActivityList=function(){var el=d.getElementById('activity-list');if(!el)return;var latest=(w.activityData||[])[0];if(!latest){el.innerHTML='<div class="ex-empty">Nog geen activiteit.</div>';return;}el.innerHTML='<button class="ex-feed" onclick="showScreen(\'feed\')"><span class="ex-feed-avatars"><span class="ex-mini">'+w.exInitials(w.myName)+'</span><span class="ex-mini">'+w.exInitials(w.partnerName)+'</span></span><span><span class="ex-feed-text">'+w.exEscape(latest.text||'Nieuwe activiteit')+'</span><span class="ex-feed-time">'+w.exEscape(latest.time||'Zojuist')+'</span></span><span class="ex-feed-xp">+15 XP</span></button>';};

    var oldShow=w.showScreen;
    w.renderHome=function(){d.body.setAttribute('data-current-screen','home');w.installExactHome();if(typeof w.updateHomeXP==='function')w.updateHomeXP();var t=d.getElementById('ex-time');if(t)t.textContent=new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});var me=d.getElementById('ex-me');if(me)me.textContent=w.exInitials(w.myName);var pa=d.getElementById('ex-partner');if(pa)pa.textContent=w.exInitials(w.partnerName);var xp=d.getElementById('ex-family-xp');if(xp)xp.textContent=w.exFormat((w.myXP||0)+(w.partnerXPStore||0));var today=d.getElementById('ex-today');if(today)today.textContent='+'+Math.max(0,Math.round((w.myXP||0)/8))+' today';if(typeof w.updateStats==='function')w.updateStats();w.renderExactQuests();w.renderExactGroup();w.renderActivityList();};
    if(typeof oldShow==='function'){w.showScreen=function(id){if(id==='home')d.body.setAttribute('data-current-screen','home');else d.body.removeAttribute('data-current-screen');return oldShow.apply(this,arguments);};}
    try{w.renderHome();}catch(e){}
  }
})();
</script>
</body>
</html>
