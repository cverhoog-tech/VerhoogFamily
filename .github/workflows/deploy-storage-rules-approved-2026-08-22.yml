name: Deploy approved Firebase Storage Rules 2026-08-22

on:
  push:
    branches:
      - agent/household-rebuild-v2
    paths:
      - .github/workflows/deploy-storage-rules-approved-2026-08-22.yml
      - storage.rules
      - scripts/deploy-storage-rules-direct.js

permissions:
  contents: read
  statuses: write

concurrency:
  group: firebase-storage-rules-production
  cancel-in-progress: false

jobs:
  deploy-storage-rules:
    name: Deploy approved Cloud Storage rules
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Mark Firebase deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context='Firebase Storage Rules' -f description='Deploying approved production Storage rules' -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          ref: agent/household-rebuild-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify approved Storage rules are registered
        run: |
          node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('firebase.json','utf8')); if(!cfg.storage || cfg.storage.rules!=='storage.rules') throw new Error('storage.rules is not registered in firebase.json'); if(!fs.existsSync('storage.rules')) throw new Error('storage.rules missing'); if(!fs.existsSync('scripts/deploy-storage-rules-direct.js')) throw new Error('direct rules deploy script missing'); console.log('Approved Storage rules configuration verified')"

      - name: Write Firebase service account credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy and verify Storage rules via Firebase Rules API
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: verhoog-family
          FIREBASE_STORAGE_BUCKET: verhoog-family.firebasestorage.app
          FIREBASE_STORAGE_RULES: storage.rules
        run: node scripts/deploy-storage-rules-direct.js

      - name: Mark Firebase deployment successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context='Firebase Storage Rules' -f description='Approved production Storage rules deployed and verified' -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark Firebase deployment failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f context='Firebase Storage Rules' -f description='Production Storage rules deployment failed' -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
