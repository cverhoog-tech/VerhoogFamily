name: Search autocomplete AI context contract

on:
  pull_request:
    paths:
      - 'src/core/searchContextService.js'
      - 'src/core/autocompleteContextBridge.js'
      - 'src/core/autocomplete.js'
      - 'src/core/search.js'
      - 'api/app.js'
      - 'tests/search-context-*.test.js'
      - '.github/workflows/search-context-contract.yml'
  push:
    branches:
      - main
      - agent/household-context-foundation
    paths:
      - 'src/core/searchContextService.js'
      - 'src/core/autocompleteContextBridge.js'
      - 'src/core/autocomplete.js'
      - 'src/core/search.js'
      - 'api/app.js'
      - 'tests/search-context-*.test.js'
      - '.github/workflows/search-context-contract.yml'

permissions:
  contents: read

jobs:
  search-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check src/core/searchContextService.js
          node --check src/core/autocompleteContextBridge.js
          node --check src/core/search.js
          node --check tests/search-context-rebind.test.js
          node --check tests/search-context-adoption.test.js
          node --check api/app.js
      - name: Search account-switch isolation
        run: node tests/search-context-rebind.test.js
      - name: Search autocomplete AI adoption
        run: node tests/search-context-adoption.test.js
