name: STEP 13.7 Integrated Acceptance

on:
  push:
    branches:
      - agent/household-rebuild-v2-step13-7-restart-from-13-6
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
      - 'database.rules.json'
      - 'firebase.json'
      - '.github/workflows/step13-7-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step13-7-integrated-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    name: Syntax + full rebuild contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restart branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        shell: bash
        run: |
          set -e
          find src api scripts -type f -name '*.js' -print0 | while IFS= read -r -d '' js_file; do
            node --check "$js_file"
          done

      - name: Full rebuild contract suite
        shell: bash
        run: |
          set -e
          for test_file in scripts/test-*.js; do
            echo "Running ${test_file}"
            node "${test_file}"
          done
