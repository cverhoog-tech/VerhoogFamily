name: STEP 13.7 Integrated Acceptance

on:
  push:
    branches:
      - agent/household-rebuild-v2-step13-7-restart-from-13-6
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
      - 'database.rules.json'
      - 'firebase.json'
      - '.github/workflows/step13-7-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step13-7-integrated-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    name: Served-runtime syntax + full rebuild contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restart branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Served-runtime syntax checks
        shell: bash
        run: |
          set -e
          for js_file in api/*.js scripts/test-*.js; do
            node --check "$js_file"
          done
          grep -oE "src/[A-Za-z0-9_./-]+\.js" api/app.js | sort -u | while IFS= read -r js_file; do
            if [ -f "$js_file" ]; then
              echo "Checking served runtime: $js_file"
              node --check "$js_file"
            fi
          done

      - name: Full rebuild contract suite
        shell: bash
        run: |
          failed=0
          for test_file in scripts/test-*.js; do
            echo "Running ${test_file}"
            if ! node "$test_file"; then
              echo "FAILED: ${test_file}"
              failed=1
            fi
          done
          exit "$failed"
